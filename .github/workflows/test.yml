name: HealthGuard AI Comprehensive Test Suite & CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_suite:
    name: Run Automated Test Framework (400+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome & Webdriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Verify Test Case Collection (400+ Test Cases)
        run: |
          python run_tests.py --collect-only

      - name: Execute Full Automated Test Suite (Selenium, API, Performance)
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:5000' }}
          API_BASE_URL: ${{ secrets.TEST_API_BASE_URL || 'http://localhost:5000/api' }}
          HEADLESS: "true"
        run: |
          python run_tests.py --all --headless

      - name: Export Test Cases Excel / CSV
        if: always()
        run: |
          python export_testcases_excel.py

      - name: Upload Test Artifacts & Excel Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            tests/reports/report.html
            tests/reports/junit.xml
            tests/reports/HealthGuard_AI_Test_Cases_459.csv
            tests/reports/execution.log
            tests/reports/screenshots/
          retention-days: 14
