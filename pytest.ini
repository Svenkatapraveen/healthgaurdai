[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --html=tests/reports/report.html --self-contained-html --junitxml=tests/reports/junit.xml

markers =
    web: Selenium Web UI test cases
    mobile: Appium Mobile test cases
    api: REST API integration test cases
    performance: Load & Performance benchmark scenarios
    smoke: Critical path smoke test scenarios
    regression: Full regression test suite
    critical: Mission critical health & safety tests
